server:
  port: 8080

spring:
  application:
    name: pv-challenge

  profiles:
    active: redis

  data:
    mongodb:
      uri: mongodb://localhost:27017/pv_challenge_db
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  users:
    - username: admin
      password: admin
      roles: ADMIN
    - username: user
      password: user
      roles: USER
  jwt:

    issuer: ${SECURITY_JWT_ISSUER:pv-challenge}
    secret: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET is required}
    expirySeconds: ${SECURITY_JWT_EXPIRYSECONDS:3600}